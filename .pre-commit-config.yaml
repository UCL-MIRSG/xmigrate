---
repos:
  - repo: https://github.com/UCL-MIRSG/.github
    rev: v0.239.0
    hooks:
      - id: mirsg-hooks
        exclude: |-
          (?x)^(
              .github/schemas/github-issue-forms.json|
              tests/integration/configs/.*
          )$
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
