---
name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize

concurrency:
  cancel-in-progress: true
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  tests-integration:
    if: github.event.pull_request.draft == false
    name: Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@6ee6290f1cbc4156c0bdd66691b2c144ef8df19a # v7
        with:
          python-version: 3.14

      - name: Cache nox
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          key:
            tests-integ-${{ hashFiles('pyproject.toml') }}-${{
            hashFiles('noxfile.py') }}
          path: .nox

      - name: Install only dev dependencies
        run: uv sync --only-dev

      - name: Start SSL Postgres test database
        run: |
          set -euxo pipefail

          mkdir -p /tmp/pgssl
          openssl req -new -x509 -days 1 -nodes \
            -out /tmp/pgssl/root.crt \
            -keyout /tmp/pgssl/root.key \
            -subj "/CN=test-ca"

          openssl req -new -nodes \
            -out /tmp/pgssl/server.csr \
            -keyout /tmp/pgssl/server.key \
            -subj "/CN=localhost"

          openssl x509 -req -days 1 \
            -in /tmp/pgssl/server.csr \
            -CA /tmp/pgssl/root.crt \
            -CAkey /tmp/pgssl/root.key \
            -CAcreateserial \
            -out /tmp/pgssl/server.crt"

          openssl req -new -nodes \
            -out /tmp/pgssl/client.csr \
            -keyout /tmp/pgssl/client.key \
            -subj "/CN=xnatadmin"

          openssl x509 -req -days 1 \
            -in /tmp/pgssl/client.csr \
            -CA /tmp/pgssl/root.crt \
            -CAkey /tmp/pgssl/root.key \
            -CAcreateserial \
            -out /tmp/pgssl/client.crt


          chmod 600 /tmp/pgssl/server.key /tmp/pgssl/client.key

          cat > /tmp/pgssl/pg_hba.conf <<'EOF'
          hostssl xnat xnatadmin 0.0.0.0/0 md5 clientcert=verify-ca
          hostssl xnat xnatadmin ::/0 md5 clientcert=verify-ca
          EOF

          docker run -d --name xmigrate-postgres-ssl \
            --user root \
            -e POSTGRES_DB=xnat \
            -e POSTGRES_USER=xnatadmin \
            -e POSTGRES_PASSWORD=xnatadmin \
            -p 15432:5432 \
            -v /tmp/pgssl:/certs \
            postgres:16 \
            bash -lc '
              chown postgres:postgres /certs/server.key /certs/server.crt /certs/root.crt /certs/pg_hba.conf
              chmod 600 /certs/server.key
              exec docker-entrypoint.sh postgres \
                -c ssl=on \
                -c ssl_ca_file=/certs/root.crt \
                -c ssl_cert_file=/certs/server.crt \
                -c ssl_key_file=/certs/server.key \
                -c hba_file=/certs/pg_hba.conf
            '

          for i in {1..30}; do
            if docker exec xmigrate-postgres-ssl pg_isready -U xnatadmin -d xnat; then
              break
            fi

            if ! docker ps --format '{{.Names}}' | grep -q '^xmigrate-postgres-ssl$'; then
              docker logs xmigrate-postgres-ssl
              exit 1
            fi

            sleep 1
          done

          docker exec xmigrate-postgres-ssl psql -U xnatadmin -d xnat \
            -c "CREATE TABLE test_table (value integer); INSERT INTO test_table VALUES (1);"

      - name: Test with nox
        run: uv run nox -s tests_integration
        env:
          FORCE_COLOR: 1

  tests-unit:
    if: github.event.pull_request.draft == false
    name: Run Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.13"
          - "3.14"
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@6ee6290f1cbc4156c0bdd66691b2c144ef8df19a # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache nox
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          key:
            tests-unit-${{ hashFiles('pyproject.toml') }}-${{
            hashFiles('noxfile.py') }}-${{ matrix.python-version }}
          path: .nox

      - name: Install only dev dependencies
        run: uv sync --only-dev

      - name: Test with nox
        run: uv run nox -s coverage-${{ matrix.python-version }}
        env:
          FORCE_COLOR: 1

      - name: Upload core coverage to Coveralls
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2
        with:
          flag-name: coverage-${{ matrix.python-version }}
          parallel: true

  aggregate-tests:
    needs:
      - tests-unit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls finished
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2
        with:
          carryforward: coverage-3.13,coverage-3.14
          parallel-finished: true
